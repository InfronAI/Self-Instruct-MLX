[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "self-instruct-mlx"
version = "0.2.0"
description = "A fully local Self-Instruct pipeline for Apple Silicon, powered by MLX"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["rouge-score==0.1.2", "tqdm>=4.66,<5", "numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/InfronAI/Self-Instruct-MLX"
Issues = "https://github.com/InfronAI/Self-Instruct-MLX/issues"

[project.optional-dependencies]
mlx = [
  "mlx==0.29.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.28.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==4.57.1", "huggingface-hub==0.36.0",
]
api = ["openai>=2,<3"]
viz = ["matplotlib>=3.9,<4", "pillow>=11,<13"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
notebook = ["pandas>=2,<3", "spacy>=3.7,<4", "benepar>=0.2,<0.3", "plotly>=5,<7", "jupyterlab>=4,<5"]

[project.scripts]
self-instruct = "self_instruct.cli:main"

[tool.setuptools.packages.find]
include = ["self_instruct*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
